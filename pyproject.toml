[project]
name = "hamster"
version = "0.1.1"
description = "Hamster in a Wheel"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pandas>=2.2.3,<3.0.0",
    "requests>=2.32.3,<3.0.0",
    "toml>=0.10.2,<0.11.0",
    "repo>=0.3.0,<0.4.0",
    "rich==14.0.0",
    "cldk==1.0.6",
    "ray>=2.46.0,<3.0.0",
    "typer>=0.16.0,<0.17.0",
    "pydantic>=2.11.0,<3.0.0",
    "tree-sitter>=0.24.0,<0.25.0",
    "tree-sitter-java>=0.23.5,<0.24.0",
    "matplotlib>=3.10.3,<4.0.0",
    "seaborn>=0.13.2,<0.14.0",
    "upsetplot>=0.9.0,<0.10.0",
    "tqdm>=4.67.1,<5.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pyright>=1.1.407,<2.0.0",
]

[project.scripts]
hamster = "hamster.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-vv --tb=short"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hamster"]
